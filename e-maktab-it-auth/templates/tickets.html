{% extends "base.html" %}{% block title %}Murojaatlar{% endblock %}{% block content %}<h1 class="text-2xl font-black text-blue-900 mb-5">Texnik yordam murojaatlari</h1><form method="post" class="bg-white border rounded-2xl p-5 grid sm:grid-cols-2 gap-3 mb-5"><input name="teacher" required placeholder="O‘qituvchi" class="border rounded-xl p-3"><input name="room" placeholder="Xona" class="border rounded-xl p-3"><input name="title" required placeholder="Muammo mavzusi" class="border rounded-xl p-3"><select name="priority" class="border rounded-xl p-3"><option>Past</option><option selected>O‘rta</option><option>Yuqori</option></select><textarea name="description" required placeholder="Tavsif" class="border rounded-xl p-3 sm:col-span-2"></textarea><button class="bg-blue-700 text-white rounded-xl p-3">Murojaat qo‘shish</button></form>{% for t in tickets %}<article class="bg-white border rounded-2xl p-5 mb-3"><div class="flex flex-wrap justify-between gap-3"><div><h2 class="font-bold">{{ t.title }}</h2><p class="text-sm text-slate-500">{{ t.teacher }} · {{ t.room or 'Xona yo‘q' }} · {{ t.priority }}</p></div><form method="post" action="/tickets/{{ t.id }}/status"><select name="status" class="border rounded-lg p-2">{% for s in ['Yangi','Jarayonda','Yopildi'] %}<option {{ 'selected' if t.status==s else '' }}>{{ s }}</option>{% endfor %}</select><button class="bg-blue-700 text-white rounded-lg px-3 py-2">Saqlash</button></form></div><p class="mt-3">{{ t.description }}</p></article>{% else %}<p class="text-slate-400">Murojaatlar yo‘q.</p>{% endfor %}{% endblock %}
