{% extends "base.html" %}{% block title %}O‘quvchilar{% endblock %}{% block content %}<h1 class="text-2xl font-black text-blue-900 mb-5">O‘quvchilar ro‘yxati</h1><form method="post" class="bg-white border rounded-2xl p-5 grid sm:grid-cols-4 gap-3 mb-5"><input name="name" required placeholder="F.I.Sh." class="border rounded-xl p-3"><input name="class_name" required placeholder="Sinf: 7-A" class="border rounded-xl p-3"><input name="group_name" placeholder="Guruh" class="border rounded-xl p-3"><button class="bg-blue-700 text-white rounded-xl p-3 font-bold">Qo‘shish</button></form><div class="bg-white border rounded-2xl overflow-x-auto"><table class="w-full text-sm"><tr class="bg-slate-50"><th class="p-3 text-left">F.I.Sh.</th><th class="p-3 text-left">Sinf</th><th class="p-3 text-left">Guruh</th><th></th></tr>{% for s in students %}<tr class="border-t"><td class="p-3">{{ s.name }}</td><td class="p-3">{{ s.class_name }}</td><td class="p-3">{{ s.group_name }}</td><td class="p-3"><form method="post" action="/students/{{ s.id }}/delete" onsubmit="return confirm('O‘chirilsinmi?')"><button class="text-rose-600">O‘chirish</button></form></td></tr>{% else %}<tr><td colspan="4" class="p-6 text-center text-slate-400">Ro‘yxat bo‘sh.</td></tr>{% endfor %}</table></div>{% endblock %}
