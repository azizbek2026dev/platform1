{% extends "base.html" %}{% block title %}Inventar{% endblock %}{% block content %}<h1 class="text-2xl font-black text-blue-900 mb-5">IT jihozlari</h1><form method="post" class="bg-white border rounded-2xl p-5 grid sm:grid-cols-2 xl:grid-cols-5 gap-3 mb-5"><input name="name" required placeholder="Jihoz nomi" class="border rounded-xl p-3"><select name="category" class="border rounded-xl p-3">{% for c in ['Kompyuter','Proyektor','Printer','Monitor','Router','Boshqa'] %}<option>{{ c }}</option>{% endfor %}</select><input name="serial_number" placeholder="Seriya raqami" class="border rounded-xl p-3"><input name="room" placeholder="Xona" class="border rounded-xl p-3"><select name="status" class="border rounded-xl p-3"><option>Soz</option><option>Ta'mirda</option><option>Buzuq</option></select><button class="bg-blue-700 text-white rounded-xl p-3">Jihoz qo‘shish</button></form><div class="bg-white border rounded-2xl overflow-x-auto"><table class="w-full text-sm"><tr class="bg-slate-50"><th class="p-3 text-left">Jihoz</th><th class="p-3">Seriya</th><th class="p-3">Xona</th><th class="p-3">Holati</th><th></th></tr>{% for i in equipment %}<tr class="border-t"><td class="p-3">{{ i.name }} <small class="text-slate-400">{{ i.category }}</small></td><td class="p-3">{{ i.serial_number or '—' }}</td><td class="p-3">{{ i.room or '—' }}</td><td class="p-3"><form method="post" action="/inventory/{{ i.id }}/update"><select name="status" onchange="this.form.submit()" class="border rounded-lg p-2"><option {{ 'selected' if i.status=='Soz' else '' }}>Soz</option><option {{ 'selected' if i.status=="Ta'mirda" else '' }}>Ta'mirda</option><option {{ 'selected' if i.status=='Buzuq' else '' }}>Buzuq</option></select></form></td><td class="p-3"><form method="post" action="/inventory/{{ i.id }}/delete"><button class="text-rose-600">O‘chirish</button></form></td></tr>{% else %}<tr><td colspan="5" class="p-5 text-center">Inventar bo‘sh.</td></tr>{% endfor %}</table></div>{% endblock %}
